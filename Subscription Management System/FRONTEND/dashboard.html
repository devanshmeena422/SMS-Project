<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Subscription Management System</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <nav>
        <h2>Subscription Management System</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="plans.html">Plans</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html">Logout</a></li>
        </ul>
    </nav>
</header>

<section class="dashboard">

    <h1>Customer Dashboard</h1>

    <div class="dashboard-container">

        <div class="card">
            <h3>Customer Name</h3>
            <p id="userName">Guest User</p>
        </div>

        <div class="card">
            <h3>Email</h3>
            <p id="userEmail">guest@email.com</p>
        </div>

        <div class="card">
            <h3>Current Plan</h3>
            <p id="planName">No Plan Selected</p>
        </div>

        <div class="card">
            <h3>Plan Price</h3>
            <p id="planPrice">₹0</p>
        </div>

        <div class="card">
            <h3>Subscription Status</h3>
            <p>Active</p>
        </div>

        <div class="card">
            <h3>Remaining Days</h3>
            <p>30 Days</p>
        </div>

    </div>

    <div class="button-box">

        <button id="renewButton">Renew Subscription</button>

        <button id="cancelButton">Cancel Subscription</button>

    </div>

</section>

<footer>
    <p>© 2026 Subscription Management System</p>
</footer>

<script src="js/dashboard.js"></script>

</body>
</html>
